<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Manager</title>
    <!-- Linking stylesheets -->
    <link rel="stylesheet" href="mainpage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
   <!-- Main Container -->
    <div class="container">

        <!-- Header Section -->
        <div class="icon-text-container">
            <img src="icons/icon128.png" alt="PabiboPass" class="small-icon">
            <h2>PabiboPass</h2>
          

    
        </div>
        <br><br>
        <div id="master-password-section">
            <!-- Master Password Toggle -->
            <input type="checkbox" id="master-password-toggle" style="display: none;">
            <label for="master-password-toggle" class="button-65">
                <i class="fa-solid fa-key"></i>
            </label>
        
            <!-- Master Password Change Form -->
            <div id="master-password-change-form" class="slide">
                <input type="password" id="current-master-password" placeholder="Enter current master password">
                <input type="password" id="new-master-password" placeholder="Enter new master password">
                <input type="password" id="confirm-new-master-password" placeholder="Confirm new master password">
                <button id="save-new-password-btn" class="button-65">Save New Password</button>
            </div>
        </div>
        <!-- Password Generator Section -->
        <div class="accSec">
         <div id="password-generator-section">
            <h2>Password Generator</h2>
            <div class="password-generator-container">
                <button id="generate-password-button" class="button-65" type="button">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <input type="text" id="generated-password-output" readonly placeholder="Generated password" />
                <button id="copy-password-button" class="copy-button" type="button">
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
         </div>
        </div>


      

        <!-- Search Account Section -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search Account..">
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <!-- Manage Section -->
        <div class="manage-section">
            <h2 class="subtitle">Manage</h2>
            <div class="manage-buttons">
                <button id="add-account-button" class="button-65"> <i class="fa-solid fa-user-plus"></i></button>
                <button id="logout-button" class="button-65"><i class="fa-solid fa-right-from-bracket"></i></button>
                <button id="delete-all-button" class="button-65">  <i class="fa-solid fa-user-minus"></i></button>
                <button id="clear-storage-btn" class="button-65">
                    <i class="fa-solid fa-trash"></i>
                </button>
            
            </div>

    

        <!-- Add Account Form -->
        <div id="add-account-form" style="display:none;">
            <h2>Add New Account</h2>
            <div class="service-buttons">
                <button class="service-btn" data-url="https://facebook.com">
                    <img src="icons/facebook.png" alt="Facebook"> Facebook
                </button>
                <button class="service-btn" data-url="https://gmail.com">
                    <img src="icons/gmail.png" alt="Gmail"> Gmail
                </button>
                <button class="service-btn" data-url="https://instagram.com">
                    <img src="icons/instagram.png" alt="Instagram"> Instagram
                </button>
                <button class="service-btn" data-url="https://github.com">
                    <img src="icons/github.png" alt="Github"> Github
                </button>
                <button class="service-btn" data-url="https://linkedin.com">
                    <img src="icons/linkedin.png" alt="LinkedIn"> LinkedIn
                </button>
                <button class="service-btn custom-url-btn">
                    <img src="icons/custom.png" alt="Custom"> Custom
                </button>
            </div>
            <div class="form-group">
                <input type="text" id="account-username" placeholder="Username">
                <input type="password" id="account-password" placeholder="Password">
                <div class="url-input" style="display:none;">
                    <input type="text" id="account-url" placeholder="URL">
                </div>
            </div>
            <button id="save-account" class="button-65">Save Account</button>
        </div>


        <!-- Accounts Section -->
        <div class="accounts-section">
            <h1 class="title">Accounts</h1>
            <div class="tabs">
                
                <button class="button-65s" data-tab="all">All</button>
                <button id="cate-button" class="button-65s">List</button>
                <button class="button-65s" data-tab="favorites">Favorites</button>
           
      
                <input type="checkbox" id="touch" style="display:none;">
                <ul class="slide">
                    <div class="tabs-horizontal">
                        <button class="tab-item" data-tab="facebook">
                            <img src="icons/facebook.png" alt="Facebook">
                        </button>
                        <button class="tab-item" data-tab="gmail">
                            <img src="icons/gmail.png" alt="Gmail">
                        </button>
                        <button class="tab-item" data-tab="instagram">
                            <img src="icons/instagram.png" alt="Instagram">
                        </button>
                        <button class="tab-item" data-tab="github">
                            <img src="icons/github.png" alt="Github">
                        </button>
                        <button class="tab-item" data-tab="linkedin">
                            <img src="icons/linkedin.png" alt="LinkedIn">
                        </button>
                        <button class="tab-item" data-tab="custom">
                            <img src="icons/custom.png" alt="Custom">
                        </button>
                    </div>
                </ul>
            </div>
            <div class="priority-section">
             
                <div id="password-list">
                    <!-- Password items will be dynamically added here -->
                </div>
            </div>
        </div>

    </div>

<!-- Linking JavaScript -->
<script src="mainpage.js"></script>
</body>
</html>
